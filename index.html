<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>BEBO Payment</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f8f8f8;
      padding: 50px;
    }

    .container {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
      display: inline-block;
      margin-bottom: 40px;
    }

    button {
      padding: 10px 25px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    .result {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      color: green;
    }

    a {
      color: #007bff;
      text-decoration: none;
    }

    .games h1 {
      margin-top: 50px;
      font-size: 28px;
      color: #333;
    }

    .game-table {
      margin: 0 auto;
    }

    .game-item {
      text-align: center;
      padding: 20px;
    }

    .game-item p {
      margin-top: 10px;
      font-size: 18px;
      color: #ff5722;
      font-weight: bold;
    }

    img {
      border-radius: 10px;
      transition: transform 0.3s ease;
    }

    img:hover {
      transform: scale(1.05);
    }

  </style>
</head>
<body>

  <div class="container">
    <h2>💳 BEBO Payment</h2>
    <h2>😄 Try your Luck by just ₹9</h2>
    <p>Click below to complete payment of ₹9</p>
    <button onclick="makePayment()">Pay Now</button>

    <div class="result" id="codeResult"></div>
  </div>

  <div class="games">
    <h1>👾 Play Games</h1>
    <table class="game-table">
      <tr>
        <td class="game-item">
          <a href="https://www.crazygames.com/game/sky-riders-buk" target="_blank">
            <img src="![Image](https://github.com/user-attachments/assets/5766f1ce-9ef2-4b1d-a297-b14734716ecf)g" width="200" height="200">
          </a>
          <p>🚗 Crazy Ride</p>
        </td>
        <td class="game-item">
          <a href="https://www.crazygames.com/game/count-masters-stickman-games" target="_blank">
            <img src="phots/count.jpeg" width="200" height="200">
          </a>
          <p>👥 Master Count</p>
        </td>
        <td class="game-item">
          <a href="https://www.crazygames.com/game/guess-their-answer" target="_blank">
            <img src="phots/guess_answer.jpeg" width="200" height="200">
          </a>
          <p>🧠 Guess Answer</p>
        </td>
      </tr>
    </table>
  </div>

  <script>
    function makePayment() {
      const giftCodes = ["AB123X", "XY789Z", "SPK456", "XYZ123", "MNO123", "ABC123", "pqr123"];
      const selectedCode = giftCodes[Math.floor(Math.random() * giftCodes.length)];

      const resultDiv = document.getElementById("codeResult");
      resultDiv.innerHTML = `
        🎉 <span style="color:green;">Payment Successful!</span><br>
        Your Gift Code: <b style="color:#ff5722;">${selectedCode}</b><br><br>
        👉 <a href="gifts.html?code=${selectedCode}">Click here to view your gift</a>
      `;
    }
  </script>

</body>
</html>
